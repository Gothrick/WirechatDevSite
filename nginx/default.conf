server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer les fichiers du dépôt ni la config Docker
    location ~ /\.            { deny all; }
    location ~* ^/(nginx/|docker-compose\.yml|README\.md) { deny all; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Grey accueil - WireChat redesign</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
.light{--bg:#D9D7CF;--sf:#ECEAE3;--soft:#CBC9C0;--fg:#161616;--mu:#4D4C47;--or:#B93A08;--onor:#FFFFFF;--bl:#0B4F8A;--hi:#FFFFFF;--lo:#BFBDB4;--orhi:#D9622E;--orlo:#7E2705;--a1:#161616;--a2:#6A6962;--a3:#B93A08;--ona:#ECEAE3}
.dark{--bg:#1B1B1B;--sf:#262626;--soft:#303030;--fg:#EDEDED;--mu:#A8A8A8;--or:#FF6A00;--onor:#161616;--bl:#6FB1FF;--hi:#3A3A3A;--lo:#101010;--orhi:#FF8A3D;--orlo:#B84D00;--a1:#EDEDED;--a2:#8A8A8A;--a3:#FF6A00;--ona:#161616}
.app{position:relative;width:100%;min-width:1100px;height:800px;box-sizing:border-box;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5;display:grid;grid-template-columns:88px 272px minmax(0,1fr);gap:12px;padding:12px;overflow:hidden}
.lg{font-family:'DM Mono',monospace;font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.pl{background:var(--sf);border:2px solid var(--fg);border-radius:22px;position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rail{align-items:center;gap:12px;padding:14px 0}
.srv{position:relative;width:54px;height:54px;box-sizing:border-box;border-radius:50%;border:2px solid var(--fg);background:var(--bg);box-shadow:inset -2px -3px 0 var(--lo),inset 2px 2px 0 var(--hi);display:grid;place-items:center;font-weight:700;font-size:19px}
.srv:before{content:"";position:absolute;left:-16px;top:50%;width:6px;height:0;transform:translateY(-50%);background:var(--fg);border-radius:0 5px 5px 0}
.srv.on{border-radius:20px;box-shadow:none}
.srv.on:before{height:38px}
.srv.un:before{height:8px}
.logo{background:#14100A;border-color:var(--fg);padding:0}
.logo img{width:40px;height:40px;object-fit:contain}
.cnt{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;background:var(--fg);color:var(--sf);border-radius:999px;min-width:24px;height:22px;line-height:22px;text-align:center;padding:0 6px;box-sizing:border-box}
.srv .cnt,.ib .cnt{position:absolute;right:-8px;bottom:-6px;border:3px solid var(--sf);box-sizing:content-box;height:16px;line-height:16px}
.sep{width:34px;border-top:2px solid var(--fg);opacity:.35;border-radius:2px}
.ib{position:relative;width:54px;height:54px;border-radius:50%;border:2px solid var(--fg);background:var(--sf);box-shadow:inset -2px -3px 0 var(--lo),inset 2px 2px 0 var(--hi);color:var(--fg);display:grid;place-items:center}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.me{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--sf);font-weight:700;font-size:18px;display:grid;place-items:center;border:2px solid var(--fg)}
.side .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 10px 0 18px;min-height:60px;border-bottom:2px solid var(--fg);font-weight:700;font-size:22px;letter-spacing:-.02em}
.add{width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:var(--or);color:var(--onor);box-shadow:inset -2px -3px 0 var(--orlo),inset 2px 2px 0 var(--orhi);font-size:24px;flex:none}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;margin:2px 10px;padding:0 12px;border-radius:14px}
.ch.on{background:var(--soft);font-weight:700;box-shadow:inset 2px 2px 0 var(--lo)}
.ava{position:relative;width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--ona)}
.ava.s{width:34px;height:34px;font-size:15px}
.a1{background:var(--a1)}.a2{background:var(--a2);color:var(--sf)}.a3{background:var(--a3);color:var(--onor)}
.dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:3px solid var(--sf);background:var(--fg)}
.dot.away{background:var(--sf);box-shadow:inset 0 0 0 2px var(--mu)}
.dot.off{background:repeating-linear-gradient(45deg,var(--fg) 0 2px,var(--sf) 2px 4px)}
.sub{font-size:13px;color:var(--mu);line-height:1.2}
.row2{display:flex;align-items:center;gap:10px;min-width:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;min-height:60px;border-bottom:2px solid var(--fg)}
.hd h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.search{color:var(--fg);display:flex;align-items:center;gap:8px;border:2px solid var(--fg);background:var(--bg);box-shadow:inset 2px 2px 0 var(--lo);border-radius:999px;padding:6px 18px;min-height:44px;font-size:15px}
.search i{width:14px;height:14px;border:2px solid var(--fg);border-radius:50%;box-sizing:border-box}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}
.nt{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-right:10px}
.tab{min-height:44px;border-radius:999px;border:2px solid var(--fg);background:var(--sf);box-shadow:inset -2px -3px 0 var(--lo),inset 2px 2px 0 var(--hi);color:var(--fg);padding:0 22px;font-weight:700;font-size:16px}
.tab.on{background:var(--fg);color:var(--sf);box-shadow:none}
.list{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fr{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 12px;border-radius:16px}
.fr.hov{background:var(--soft)}
.fr .nm{flex:1;min-width:0}
.rb{width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:var(--sf);box-shadow:inset -2px -3px 0 var(--lo),inset 2px 2px 0 var(--hi);color:var(--fg);display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:15px}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linejoin:round}
.rb.ok{background:var(--or);color:var(--onor);box-shadow:inset -2px -3px 0 var(--orlo),inset 2px 2px 0 var(--orhi)}
.pop{position:absolute;left:112px;bottom:20px;width:268px;background:var(--sf);border:2px solid var(--fg);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;z-index:5;box-shadow:0 0 0 5px var(--bg)}
.pop .btn{min-height:46px;border-radius:999px;border:2px solid var(--fg);background:var(--sf);box-shadow:inset -2px -3px 0 var(--lo),inset 2px 2px 0 var(--hi);color:var(--fg);font-weight:700;font-size:16px}
</style>

<style>html,body{margin:0}</style>
</head><body>

<div class="app dark">
  <nav class="pl rail" aria-label="Navigation principale">
    <div class="srv logo on" aria-label="Accueil"><img src="logo.png" alt=""></div>
    <div class="sep"></div>
    <div class="srv" aria-label="Équipe projet">ÉP</div>
    <div class="srv un" aria-label="Études, 3 non lus">ÉT<span class="cnt">3</span></div>
    <div class="srv" aria-label="Musique">MU</div>
    <div class="srv un" aria-label="Jeux vidéo, 12 non lus">JV<span class="cnt">12</span></div>
    <div class="srv" style="border-style:dashed;box-shadow:none" aria-label="Nouveau serveur">+</div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center">
      <button class="ib" aria-label="Recherche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
      <button class="ib" aria-label="Notifications (2 non lues)"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/></svg><span class="cnt">2</span></button>
      <button class="me" aria-label="Profil" aria-expanded="true">ZA</button>
    </div>
  </nav>

  <aside class="pl side">
    <div class="sh"><span>Conversations privées</span><button class="add" aria-label="Nouvelle conversation">+</button></div>
    <div style="height:8px"></div>
    <div class="ch"><span class="row2"><span class="ava s a1">AN<i class="dot"></i></span>Ana</span></div>
    <div class="ch on"><span class="row2"><span class="ava s a2">MA<i class="dot away"></i></span>Marc, Léa</span><span class="cnt">2</span></div>
    <div class="ch"><span class="row2"><span class="ava s a3">LÉ<i class="dot"></i></span>Léa</span></div>
    <div class="ch"><span class="row2"><span class="ava s a2">SO<i class="dot off"></i></span>Sofia</span></div>
  </aside>

  <main class="pl">
    <div class="hd"><h1>Tous les amis : 5</h1><button class="search"><i></i>Rechercher</button></div>
    <div class="top"><span class="nt"># Amis</span><button class="tab">En ligne</button><button class="tab on">Tous</button><button class="tab">En attente</button></div>
    <div class="list">
      <div class="fr"><span class="ava a1">AN<i class="dot"></i></span><span class="nm"><div><b>Ana</b></div><div class="sub">En ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Ana">•••</button></div>
      <div class="fr hov"><span class="ava a3">LÉ<i class="dot"></i></span><span class="nm"><div><b>Léa</b></div><div class="sub">En ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Léa">•••</button></div>
      <div class="fr"><span class="ava a2">MA<i class="dot away"></i></span><span class="nm"><div><b>Marc</b></div><div class="sub">Inactif</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Marc">•••</button></div>
      <div class="fr"><span class="ava a2">SO<i class="dot off"></i></span><span class="nm"><div><b>Sofia</b></div><div class="sub">Hors ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Sofia">•••</button></div>
      <div class="fr" style="border:2px dashed var(--fg)"><span class="ava a3">TH</span><span class="nm"><div><b>Théo</b></div><div class="sub">Demande reçue</div></span><button class="rb ok" aria-label="Accepter la demande">✓</button><button class="rb" aria-label="Refuser la demande">✕</button></div>
    </div>
  </main>

  <div class="pop" role="dialog" aria-label="Profil">
    <div class="row2"><span class="ava a1">ZA<i class="dot" style="border-color:var(--sf)"></i></span><span><div><b>Zack</b></div><div class="sub">En ligne</div></span></div>
    <button class="btn">Paramètres du profil</button>
    <button class="btn">Se déconnecter</button>
  </div>
</div>


<button id="wc-toggle" type="button" style="position:fixed;right:16px;bottom:16px;z-index:9999;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #888;background:#fff;color:#111;font:600 15px system-ui,sans-serif;cursor:pointer">Switch theme</button>
<script>
(function(){
  var b=document.getElementById('wc-toggle');
  if(location.search.indexOf('thumb')>-1){b.style.display='none';}
  b.addEventListener('click',function(){
    var els=document.querySelectorAll('.dark,.light');
    els.forEach(function(e){
      if(e.classList.contains('dark')){e.classList.remove('dark');e.classList.add('light');}
      else{e.classList.remove('light');e.classList.add('dark');}
    });
  });
})();
</script>
</body></html>

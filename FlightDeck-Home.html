<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Deck accueil - WireChat redesign</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
.dark{--bg:#14100A;--sf:#1E1810;--rail:#0E0B07;--fg:#F2E6CC;--mu:#BBA882;--ac:#FFB000;--onac:#14100A;--al:#FF6A2B;--onal:#14100A;--bd:#8A7347;--soft:#2A2116;--a1:#FFB000;--a2:#FF6A2B;--a3:#BBA882;--ona:#14100A}
.light{--bg:#F3EBDA;--sf:#FFF9EA;--rail:#E7DCC2;--fg:#2A1E0B;--mu:#66573A;--ac:#8A5300;--onac:#FFFFFF;--al:#BA3A06;--onal:#FFFFFF;--bd:#7A6841;--soft:#E7DCC2;--a1:#8A5300;--a2:#BA3A06;--a3:#66573A;--ona:#FFFFFF}
.app{position:relative;width:100%;min-width:1100px;height:800px;box-sizing:border-box;background:var(--bg);color:var(--fg);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.5;display:grid;grid-template-columns:84px 272px minmax(0,1fr);overflow:hidden}
.lab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--mu)}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.srv{position:relative;width:48px;height:48px;box-sizing:border-box;border-radius:50%;background:var(--sf);color:var(--fg);border:2px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;display:grid;place-items:center}
.srv:before{content:"";position:absolute;left:-18px;top:50%;width:5px;height:0;transform:translateY(-50%);background:var(--fg);border-radius:0 4px 4px 0}
.srv.on{border-radius:8px;box-shadow:3px 3px 0 var(--fg);border-color:var(--fg)}
.srv.on:before{height:36px}
.srv.un:before{height:8px}
.logo{background:#14100A;border-color:#F2E6CC;padding:0}
.logo img{width:36px;height:36px;object-fit:contain}
.pill{position:absolute;right:-6px;bottom:-6px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;background:var(--fg);color:var(--bg);border:3px solid var(--rail);border-radius:8px;min-width:24px;height:22px;line-height:16px;text-align:center;box-sizing:content-box;padding:0 3px}
.sep{width:32px;border-top:2px solid var(--bd);border-radius:2px}
.ib{position:relative;width:48px;height:48px;border-radius:50%;border:2px solid var(--bd);background:var(--sf);color:var(--fg);display:grid;place-items:center}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.me{width:48px;height:48px;border-radius:50%;background:var(--a1);color:var(--ona);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;display:grid;place-items:center;border:2px solid var(--fg)}
.side{background:var(--sf);display:flex;flex-direction:column;min-height:0;border-radius:8px 0 0 0;border-left:2px solid var(--bd);border-top:2px solid var(--bd)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 0 16px;min-height:60px;border-bottom:2px solid var(--bd);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;letter-spacing:.03em}
.add{width:44px;height:44px;border-radius:50%;border:2px solid var(--fg);background:var(--ac);color:var(--onac);box-shadow:3px 3px 0 var(--fg);font-family:'IBM Plex Mono',monospace;font-size:24px;display:grid;place-items:center;flex:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 8px;padding:0 10px;min-height:52px;border-radius:6px}
.ch.on{background:var(--soft);font-weight:700;box-shadow:inset 0 0 0 2px var(--ac)}
.cnt{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;background:var(--fg);color:var(--bg);border-radius:8px;min-width:22px;height:20px;line-height:20px;text-align:center;padding:0 6px;box-sizing:border-box}
.ava{position:relative;width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--ona)}
.ava.s{width:34px;height:34px;font-size:16px}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}
.dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:3px solid var(--sf);background:var(--ac)}
.dot.away{background:var(--sf);box-shadow:inset 0 0 0 2px var(--mu)}
.dot.off{background:var(--mu)}
.sub{font-size:13px;color:var(--mu);line-height:1.2}
.row2{display:flex;align-items:center;gap:10px;min-width:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;border-top:2px solid var(--bd);background:var(--bg)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:60px;padding:0 20px;border-bottom:2px solid var(--bd)}
.jc{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--onac);border-radius:5px;padding:4px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:.04em}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--bd);background:var(--sf);border-radius:8px;padding:6px 18px;min-height:44px;color:var(--fg);font-size:15px}
.search i{width:14px;height:14px;border:2px solid var(--fg);border-radius:50%;box-sizing:border-box}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px 8px}
.nt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;margin-right:10px}
.tab{min-height:44px;border-radius:8px;border:2px solid var(--bd);background:var(--sf);color:var(--fg);padding:0 20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.05em}
.tab.on{background:var(--ac);color:var(--onac);border-color:var(--fg);box-shadow:3px 3px 0 var(--fg)}
.list{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fr{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 12px;border-radius:7px}
.fr.hov{background:var(--soft)}
.fr .nm{flex:1;min-width:0}
.rb{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--sf);color:var(--fg);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:16px}
.rb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linejoin:round}
.rb.ok{background:var(--ac);color:var(--onac);border-color:var(--fg)}
.pop{position:absolute;left:96px;bottom:16px;width:268px;background:var(--sf);border:2px solid var(--fg);border-radius:9px;box-shadow:5px 5px 0 var(--fg);padding:14px;display:flex;flex-direction:column;gap:12px;z-index:5}
.pop .btn{min-height:46px;border-radius:6px;border:2px solid var(--bd);background:var(--bg);color:var(--fg);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em}
.pop .btn.d{border-color:var(--al);color:var(--al)}
</style>

<style>html,body{margin:0}</style>
</head><body>

<div class="app dark">
  <nav class="rail" aria-label="Navigation principale">
    <div class="srv logo on" aria-label="Accueil" style="background:#14100A"><img src="logo.png" alt=""></div>
    <div class="sep"></div>
    <div class="srv" aria-label="Équipe projet">ÉP</div>
    <div class="srv un" aria-label="Études, 3 non lus">ÉT<span class="pill">3</span></div>
    <div class="srv" aria-label="Musique">MU</div>
    <div class="srv un" aria-label="Jeux vidéo, 12 non lus">JV<span class="pill">12</span></div>
    <div class="srv" style="background:transparent;border-style:dashed" aria-label="Nouveau serveur">+</div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center">
      <button class="ib" aria-label="Recherche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
      <button class="ib" aria-label="Notifications (2 non lues)"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/></svg><span class="pill">2</span></button>
      <button class="me" aria-label="Profil" aria-expanded="true">ZA</button>
    </div>
  </nav>

  <aside class="side">
    <div class="sh"><span>Conversations privées</span><button class="add" aria-label="Nouvelle conversation">+</button></div>
    <div style="height:8px"></div>
    <div class="ch"><span class="row2"><span class="ava s a1">AN<i class="dot"></i></span>Ana</span></div>
    <div class="ch on"><span class="row2"><span class="ava s a3">MA<i class="dot away"></i></span>Marc, Léa</span><span class="cnt">2</span></div>
    <div class="ch"><span class="row2"><span class="ava s a2">LÉ<i class="dot"></i></span>Léa</span></div>
    <div class="ch"><span class="row2"><span class="ava s a3">SO<i class="dot off"></i></span>Sofia</span></div>
  </aside>

  <main class="main">
    <div class="hd"><span class="jc">Tous les amis : 5</span><button class="search"><i></i>Rechercher</button></div>
    <div class="top"><span class="nt"># Amis</span><button class="tab">En ligne</button><button class="tab on">Tous</button><button class="tab">En attente</button></div>
    <div class="list">
      <div class="fr"><span class="ava a1">AN<i class="dot"></i></span><span class="nm"><div><b>Ana</b></div><div class="sub">En ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Ana">•••</button></div>
      <div class="fr hov"><span class="ava a2">LÉ<i class="dot"></i></span><span class="nm"><div><b>Léa</b></div><div class="sub">En ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Léa">•••</button></div>
      <div class="fr"><span class="ava a3">MA<i class="dot away"></i></span><span class="nm"><div><b>Marc</b></div><div class="sub">Inactif</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Marc">•••</button></div>
      <div class="fr"><span class="ava a3">SO<i class="dot off"></i></span><span class="nm"><div><b>Sofia</b></div><div class="sub">Hors ligne</div></span><button class="rb" aria-label="Ouvrir la conversation"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="rb" aria-label="Options pour Sofia">•••</button></div>
      <div class="fr" style="border:2px dashed var(--bd)"><span class="ava a2">TH</span><span class="nm"><div><b>Théo</b></div><div class="sub">Demande reçue</div></span><button class="rb ok" aria-label="Accepter la demande">✓</button><button class="rb" aria-label="Refuser la demande">✕</button></div>
    </div>
  </main>

  <div class="pop" role="dialog" aria-label="Profil">
    <div class="row2"><span class="ava a1">ZA<i class="dot" style="border-color:var(--sf)"></i></span><span><div><b>Zack</b></div><div class="sub">En ligne</div></span></div>
    <button class="btn">Paramètres du profil</button>
    <button class="btn d">Se déconnecter</button>
  </div>
</div>


<button id="wc-toggle" type="button" style="position:fixed;right:16px;bottom:16px;z-index:9999;min-height:44px;padding:0 18px;border-radius:8px;border:2px solid #888;background:#fff;color:#111;font:600 15px system-ui,sans-serif;cursor:pointer">Switch theme</button>
<script>
(function(){
  var b=document.getElementById('wc-toggle');
  if(location.search.indexOf('thumb')>-1){b.style.display='none';}
  b.addEventListener('click',function(){
    var els=document.querySelectorAll('.dark,.light');
    els.forEach(function(e){
      if(e.classList.contains('dark')){e.classList.remove('dark');e.classList.add('light');}
      else{e.classList.remove('light');e.classList.add('dark');}
    });
  });
})();
</script>
</body></html>
